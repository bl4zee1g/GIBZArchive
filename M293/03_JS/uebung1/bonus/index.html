<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Bonus: Party Check-in</title>
  </head>
  <body>
    <h1 id="party-title">Meine Party</h1>

    <label for="color-input">Motto-Farbe</label>
    <input type="text" id="color-input" placeholder="z.B. pink oder #ff00aa" />
    <button id="color-button">Hintergrund ändern</button>

    <h2>Gästeliste</h2>
    <label for="guest-input">Gastname</label>
    <input type="text" id="guest-input" placeholder="Name des Gastes" />
    <button id="add-guest-button">Gast hinzufügen</button>
    <ul id="guest-list"></ul>

    <button id="announce-button">Party ansagen</button>

    <script src="index.js"></script>
  </body>
</html>
